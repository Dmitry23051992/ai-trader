# ╔══════════════════════════════════════════════════════════════════════╗
# ║  AI Trader — Continuous Integration                                 ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings

      - name: Ruff lint
        run: ruff check agents/ core/ configs/ ai/ tests/

      - name: MyPy type check
        run: mypy core/ configs/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --cov=agents --cov=core --cov=configs \
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml
        env:
          OPENROUTER_API_KEY: "skip"  # prevents LLM init errors
          OPENROUTER_MODEL: "skip"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: reports/coverage.xml
          fail_ci_if_error: false

  dry-run:
    name: Pipeline Dry-Run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create mock data dirs
        run: |
          mkdir -p freqtrade/user_data/strategies
          mkdir -p freqtrade/user_data/backtest_results
          mkdir -p ai/database

      - name: Dry-run pipeline (1 iteration)
        run: python main.py --iterations 1
        env:
          OPENROUTER_API_KEY: "skip"
          OPENROUTER_MODEL: "skip"
